name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable major.minor.patch version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Fetch verified PresentMon
        shell: powershell
        run: ./tools/fetch-presentmon.ps1
      - name: Test
        shell: pwsh
        run: |
          dotnet test --project tests/ShiftControl.Tests -c Release --filter-not-trait "Category=Integration"
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Install installer build dependency
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build installer and portable package
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./tools/build-installer.ps1 -MakeNsis 'C:\Program Files (x86)\NSIS\makensis.exe' -OutputDirectory "$pwd\artifacts\release"
          python tools/package-portable.py artifacts/release --version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
      - name: Verify silent update in isolated portable directory
        shell: powershell
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/update-installer-smoke.ps1 -Installer "$pwd\artifacts\release\ShiftControl-$env:APP_VERSION-setup.exe"
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $tag = "v$env:APP_VERSION"
          $existing = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          $match = $existing | Where-Object tagName -eq $tag
          if ($match -and -not $match.isDraft) {
            Write-Host 'Version already published. Increase Directory.Build.props Version for the next release.'
            exit 0
          }
          if (-not $match) {
            gh release create $tag --target $env:GITHUB_SHA --title "Shift Control $env:APP_VERSION" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release.' }
          }
          $files = Get-ChildItem artifacts/release -File | Where-Object { $_.Name -match '\.(exe|zip|sha256)$' } | Select-Object -ExpandProperty FullName
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release assets.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release.' }
