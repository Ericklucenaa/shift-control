<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
 <title id="title">Format Kit: proposta de organização</title>
 <desc id="desc">Janela ampla com catálogo à esquerda e ações à direita. Janela estreita com catálogo acima das ações. Busca fixa, status abaixo do nome e aviso de seleção fora do filtro.</desc>
 <style>text{font-family:Segoe UI,sans-serif;fill:#ECEDEE;font-size:15px}.hint{fill:#A0A4AA;font-size:13px}.box{fill:#17181A;stroke:#41464D}.line{stroke:#41464D}.action{fill:#1E2023;stroke:#A0A4AA}</style>
